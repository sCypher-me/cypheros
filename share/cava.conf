# Espectro de som para o wallpaper musical do CypherOS (lido pelo shell).
[general]
bars = 16
framerate = 60
autosens = 1
sleep_timer = 2

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
monstercat = 1
