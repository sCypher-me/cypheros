# Cypher Term · o terminal do CypherOS (motor: kitty)
# Suas mudanças vão em ~/.config/cypher-term/usuario.conf (incluído no fim).

font_family      JetBrains Mono
font_size        11.5
disable_ligatures never
cursor_shape     beam
cursor_blink_interval 0.6
cursor_trail     3
scrollback_lines 10000

# vidro: o Hyprland desfoca o que está atrás
background_opacity 0.84
dynamic_background_opacity yes
window_padding_width 14 18
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.12

# abas no topo, estilo Prisma
tab_bar_edge         top
tab_bar_margin_width 10
tab_bar_margin_height 8 4
tab_bar_style        custom
tab_bar_min_tabs     1
tab_title_template   "{index}  {title[:28]}"

# divisões (splits)
enabled_layouts splits,stack
window_border_width 1.5pt
draw_minimal_borders yes
inactive_text_alpha 0.72
window_margin_width 2

# atalhos
map ctrl+shift+t       new_tab_with_cwd
map ctrl+shift+w       close_window
map ctrl+shift+enter   launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus   launch --location=hsplit --cwd=current
map ctrl+shift+z       toggle_layout stack
map alt+left           neighboring_window left
map alt+right          neighboring_window right
map alt+up             neighboring_window up
map alt+down           neighboring_window down
map ctrl+shift+left    resize_window narrower
map ctrl+shift+right   resize_window wider
map ctrl+shift+up      resize_window taller
map ctrl+shift+down    resize_window shorter
map ctrl+tab           next_tab
map ctrl+shift+tab     previous_tab
map ctrl+shift+a>1     set_background_opacity 1
map ctrl+shift+a>d     set_background_opacity default
map ctrl+plus          change_font_size all +1
map ctrl+minus         change_font_size all -1
map ctrl+0             change_font_size all 0
map ctrl+shift+f       launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i --tac

# cores do tema atual (o shell reescreve quando você troca de tema)
include /usr/share/cypheros/term/cores-prisma.conf
include ~/.config/cypheros/term-cores.conf
include ~/.config/cypher-term/usuario.conf
