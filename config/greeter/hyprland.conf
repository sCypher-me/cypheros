# Hyprland mínimo só para a tela de login do CypherOS
env = XCURSOR_THEME,Prisma-cursor
env = XCURSOR_SIZE,24
monitor = , preferred, auto, 1
exec-once = qs -p /etc/xdg/quickshell/cypheros/greeter.qml; hyprctl dispatch exit

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

animations {
    enabled = true
}

decoration {
    blur {
        enabled = true
        size = 8
        passes = 3
    }
}

input {
    kb_layout = br
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

layerrule = match:namespace ^(cypheros-greeter)$, blur on
