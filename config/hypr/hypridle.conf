general {
    lock_cmd = qs -c cypheros ipc call lock lock
    before_sleep_cmd = qs -c cypheros ipc call lock lock
    after_sleep_cmd = hyprctl dispatch dpms on
}
listener {
    timeout = 300
    on-timeout = qs -c cypheros ipc call lock lock
}
listener {
    timeout = 420
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
