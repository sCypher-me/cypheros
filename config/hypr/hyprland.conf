# ┌──────────────────────────────────────────────┐
# │  CypherOS · Hyprland (visual Prisma)          │
# │  Suas mudanças pessoais: ~/.config/hypr/      │
# │  usuario.conf (carregado no final)            │
# └──────────────────────────────────────────────┘

monitor = , preferred, auto, 1

$term = cypher-term
$files = nautilus
$browser = firefox
$qs = qs -c cypheros ipc call

# ── Início ──────────────────────────────────────
exec-once = cypher-shell
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = hypridle
exec-once = hyprctl setcursor Prisma-cursor 24
exec-once = sh -c "command -v kdeconnectd && exec kdeconnectd || exec /usr/lib/kdeconnectd"
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark; gsettings set org.gnome.desktop.interface icon-theme Prisma; gsettings set org.gnome.desktop.interface cursor-theme Prisma-cursor; gsettings set org.gnome.desktop.interface cursor-size 24; gsettings set org.gnome.desktop.interface font-name "Manrope 11"; gsettings set org.gnome.desktop.interface monospace-font-name "JetBrains Mono 11"
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

env = XCURSOR_THEME,Prisma-cursor
env = HYPRCURSOR_THEME,Prisma-cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = XDG_CURRENT_DESKTOP,CypherOS:Hyprland

# ── Visual Prisma ───────────────────────────────
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 1
    col.active_border = rgba(38e1ffcc) rgba(a78bfa66) rgba(f472b6aa) 45deg
    col.inactive_border = rgba(ffffff14)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 16
    rounding_power = 2.4
    active_opacity = 1.0
    inactive_opacity = 0.94
    dim_inactive = false

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000077)
        color_inactive = rgba(00000044)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.015
        contrast = 1.0
        brightness = 0.9
        vibrancy = 0.2
        popups = true
    }
}

animations {
    enabled = true
    # curvas da folha de estilo Prisma
    bezier = entra, 0.2, 0.8, 0.2, 1
    bezier = mola, 0.2, 0.9, 0.3, 1.2
    bezier = sai, 0.4, 0, 1, 1

    animation = windowsIn, 1, 4, mola, popin 92%
    animation = windowsOut, 1, 3, sai, popin 94%
    animation = windowsMove, 1, 4, entra
    animation = border, 1, 6, entra
    animation = borderangle, 1, 80, entra, loop
    animation = fade, 1, 4, entra
    animation = layersIn, 1, 4, entra, fade
    animation = layersOut, 1, 3, sai, fade
    animation = workspaces, 1, 5, entra, slidefade 18%
}

# Desfoque de vidro atrás dos painéis do CypherOS
layerrule = match:namespace ^(cypheros-(bar|dock|control|launcher|notifications|osd|widgets|focus|overview))$, blur on
layerrule = match:namespace ^(cypheros-(bar|dock|control|launcher|notifications|osd|widgets|focus|overview))$, ignore_alpha 0.3
layerrule = match:namespace ^(cypheros-(control|launcher|notifications|osd|overview|ruler|focus))$, no_anim on

dwindle {
    preserve_split = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    animate_manual_resizes = true
}

input {
    kb_layout = br
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, workspace

# ── Regras de janelas ───────────────────────────
windowrule = match:class ^(pavucontrol|nm-connection-editor|blueman-manager|org.gnome.Calculator)$, float on
windowrule = match:title ^(Picture-in-Picture|Picture in picture)$, float on
windowrule = match:class ^(com.gabm.satty)$, float on
windowrule = match:title ^(CypherOS · .*)$, float on
windowrule = match:title ^(CypherOS · .*)$, center on
windowrule = match:class ^(com.gabm.satty)$, center on
windowrule = match:title ^(Picture-in-Picture|Picture in picture)$, pin on

# ── Atalhos ─────────────────────────────────────
$mod = SUPER

bind = $mod, SPACE, exec, $qs launcher toggle
bind = $mod, N, exec, $qs control toggle
bind = $mod, L, exec, $qs lock lock
bind = $mod, ESCAPE, exec, $qs power toggle
bind = $mod, I, exec, cypher-app central
bind = CTRL SHIFT, ESCAPE, exec, cypher-app monitor
bind = $mod, RETURN, exec, $term
bind = $mod, E, exec, $files
bind = $mod, B, exec, $browser
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, V, exec, $qs launcher clipboard
bind = $mod SHIFT, V, togglefloating
bind = $mod, PERIOD, exec, $qs launcher emoji
bind = $mod, A, exec, $qs launcher ai
bind = $mod, C, exec, $qs calendar toggle
bind = $mod SHIFT, F, exec, $qs focus toggle
bind = $mod SHIFT, P, exec, $qs profile next
bind = $mod, G, exec, $qs game toggle
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit
bind = $mod SHIFT, D, exec, $qs dnd toggle
bind = , PRINT, exec, $qs screenshot full
bind = $mod, PRINT, exec, $qs screenshot menu
bind = $mod SHIFT, S, exec, $qs screenshot area
bind = $mod SHIFT, E, exec, $qs screenshot edit
bind = $mod SHIFT, R, exec, $qs record toggle
bind = $mod SHIFT, C, exec, $qs tools color
bind = $mod SHIFT, M, exec, $qs tools ruler
bind = $mod, TAB, exec, $qs overview toggle

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# teclas de som e brilho (passam pelo shell, que mostra o indicador)
bindel = , XF86AudioRaiseVolume, exec, $qs volume up
bindel = , XF86AudioLowerVolume, exec, $qs volume down
bindl = , XF86AudioMute, exec, $qs volume mute
bindl = , XF86AudioMicMute, exec, $qs volume mic
bindel = , XF86MonBrightnessUp, exec, $qs brightness up
bindel = , XF86MonBrightnessDown, exec, $qs brightness down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ajustes feitos pela Central CypherOS (tela, teclado, mouse)
source = ~/.config/hypr/central.conf
source = ~/.config/hypr/usuario.conf
